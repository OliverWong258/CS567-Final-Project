# Ultralytics YOLO26 object detection model with P2/4 - P4/16 outputs (P5 removed)
# Task: Optimized for small object detection (e.g., VisDrone)

# Parameters
nc: 80 # number of classes
end2end: True 
reg_max: 1 
scales: 
  n: [0.50, 0.25, 1024] 
  s: [0.50, 0.50, 1024] 
  m: [0.50, 1.00, 512] 
  l: [1.00, 1.00, 512] 
  x: [1.00, 1.50, 512] 

# YOLO26n backbone (Truncated at P4)
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2-P2/4
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4-P3/8
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]] # 6-P4/16
  - [-1, 1, SPPF, [512, 5, 3, True]] # 7 (Moved SPPF to P4)
  - [-1, 2, C2PSA, [512]] # 8 (New top layer)

# YOLO26n head (P2, P3, P4 only)
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 9 (P4 -> P3)
  - [[-1, 4], 1, Concat, [1]] # 10 (cat backbone P3)
  - [-1, 2, C3k2, [256, True]] # 11 (P3-small)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 12 (P3 -> P2)
  - [[-1, 2], 1, Concat, [1]] # 13 (cat backbone P2)
  - [-1, 2, C3k2, [128, True]] # 14 (P2-xsmall) -> Detect Head 1

  - [-1, 1, Conv, [128, 3, 2]] # 15 (P2 -> P3)
  - [[-1, 11], 1, Concat, [1]] # 16 (cat head P3)
  - [-1, 2, C3k2, [256, True]] # 17 (P3-small) -> Detect Head 2

  - [-1, 1, Conv, [256, 3, 2]] # 18 (P3 -> P4)
  - [[-1, 8], 1, Concat, [1]] # 19 (cat head P4)
  - [-1, 2, C3k2, [512, True]] # 20 (P4-medium) -> Detect Head 3

  - [[14, 17, 20], 1, Detect, [nc]] # Detect(P2, P3, P4)