# Ultralytics YOLO26 - Compromise version
# Backbone has P5 for context, Head detects only P2, P3, P4

# Parameters
nc: 80 
scales: 
  n: [0.50, 0.25, 1024] 

# YOLO26n backbone (完整保留 P5 层)
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]] # 6
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]] # 8
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 9 (此时 1024 是正确的，因为来自 P5)
  - [-1, 2, C2PSA, [1024]] # 10

# YOLO26n head (从 P5 融合信息，但只检测到 P4)
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 11 (P5 -> P4)
  - [[-1, 6], 1, Concat, [1]] # 12 (cat backbone P4)
  - [-1, 2, C3k2, [512, True]] # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 14 (P4 -> P3)
  - [[-1, 4], 1, Concat, [1]] # 15 (cat backbone P3)
  - [-1, 2, C3k2, [256, True]] # 16 (P3-small)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 17 (P3 -> P2)
  - [[-1, 2], 1, Concat, [1]] # 18 (cat backbone P2)
  - [-1, 2, C3k2, [128, True]] # 19 (P2-xsmall) -> 检测头 1

  - [-1, 1, Conv, [128, 3, 2]] # 20 (P2 -> P3)
  - [[-1, 16], 1, Concat, [1]] # 21 (cat head P3)
  - [-1, 2, C3k2, [256, True]] # 22 (P3-small) -> 检测头 2

  - [-1, 1, Conv, [256, 3, 2]] # 23 (P3 -> P4)
  - [[-1, 13], 1, Concat, [1]] # 24 (cat head P4)
  - [-1, 2, C3k2, [512, True]] # 25 (P4-medium) -> 检测头 3

  # 去掉了原版中的 P5 检测分支 (即原 26, 27, 28 层)
  - [[19, 22, 25], 1, Detect, [nc]] # 仅 Detect(P2, P3, P4)